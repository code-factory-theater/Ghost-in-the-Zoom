<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2: Ghost Twin & Name Summon - スマート影武者システム</title>
      <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>👻 Ghost Twin & Name Summon - Phase 2</h1>
            <div class="header-controls">
                <div class="status-badge">
                    <div class="status-dot inactive" id="systemStatusDot"></div>
                    <span id="systemStatus">Ready</span>
                </div>
            </div>
        </div>

        <!-- ===== MAIN CONTENT ===== -->
        <div class="main-content">
            <!-- VIDEO SECTION -->
            <div class="video-section">
                <div class="video-container">
                    <video id="video" playsinline autoplay muted></video>
                    <canvas id="ghostCanvas"></canvas>
                    <div class="video-overlay">
                        <div class="ghost-indicator" id="ghostIndicator">
                            <div class="ghost-dot"></div>
                            <span>影武者稼働中...</span>
                        </div>
                        <div class="alert-overlay" id="alertOverlay">
                            <div class="alert-text" id="alertText">🚨 CALLING!</div>
                        </div>
                    </div>
                </div>
                <div class="video-controls">
                    <button class="btn btn-primary" id="toggleGhost">🎭 影武者ON</button>
                    <button class="btn" id="manualReturn">↩️ 実写復帰</button>
                    <button class="btn" id="openSettings">⚙️ 設定</button>
                    <button class="btn btn-danger" id="emergencyStop">🛑 緊急停止</button>
                </div>
            </div>

            <!-- CONTROL PANEL -->
            <div class="control-panel">
                <!-- Ghost Twin Section -->
                <div class="panel-section">
                    <div class="panel-title">📸 影武者ループ</div>
                    <div class="toggle-group">
                        <span class="toggle-label">ループ稼働</span>
                        <div class="switch" id="ghostSwitch">
                            <div class="switch-thumb"></div>
                        </div>
                    </div>
                    <div class="status-text" id="ghostStatus">
                        ⏹ 停止中 | ループ品質: 高
                    </div>
                </div>

                <!-- Name Summon Section -->
                <div class="panel-section">
                    <div class="panel-title">🎤 名指し検知</div>
                    <div class="toggle-group">
                        <span class="toggle-label">音声認識</span>
                        <div class="switch" id="audioSwitch">
                            <div class="switch-thumb"></div>
                        </div>
                    </div>
                    <div class="status-text" id="audioStatus">
                        ⏹ 停止中 | マイク: ✓
                    </div>
                </div>

                <!-- Trigger Words Section -->
                <div class="panel-section">
                    <div class="panel-title">🔔 トリガーワード</div>
                    <div class="trigger-words-list" id="triggerWordsList">
                        <!-- Dynamically populated -->
                    </div>
                    <div class="input-group">
                        <input type="text" id="newTriggerInput" placeholder="新規ワード入力...">
                        <button class="btn" id="addTriggerBtn">+</button>
                    </div>
                </div>

                <!-- Auto Return Section -->
                <div class="panel-section">
                    <div class="panel-title">⚡ 自動復帰</div>
                    <div class="toggle-group">
                        <span class="toggle-label">トリガーで復帰</span>
                        <div class="switch" id="autoReturnSwitch">
                            <div class="switch-thumb"></div>
                        </div>
                    </div>
                    <div class="toggle-group">
                        <span class="toggle-label">定型音声再生</span>
                        <div class="switch" id="voiceLineSwitch">
                            <div class="switch-thumb"></div>
                        </div>
                    </div>
                    <div class="status-text" id="autoReturnStatus">
                        手動復帰モード
                    </div>
                </div>

                <!-- Performance Section -->
                <div class="panel-section">
                    <div class="panel-title">📊 パフォーマンス</div>
                    <div class="status-text">
                        FPS: <span id="fpsCounter">30</span> | 
                        Memory: <span id="memoryCounter">0</span>MB
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-title">⚙️ 詳細設定</div>
            <div class="modal-body">
                <label style="color: #aaa; font-size: 12px;">
                    <input type="checkbox" id="debugMode" style="margin-right: 8px;">
                    デバッグモード
                </label>
                <label style="color: #aaa; font-size: 12px;">
                    <input type="checkbox" id="advancedLogging" style="margin-right: 8px;">
                    詳細ログ出力
                </label>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeSettings()">キャンセル</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

      <script src="js/app.js"></script>
</body>
</html>
