<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フェーズ4 - 通信崩壊シーケンサー Calamity Conductor</title>
      <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <!-- メイン映像エリア -->
        <div class="video-section">
            <canvas id="mainVideoCanvas" class="video-canvas"></canvas>
            <div class="video-info">
                <div class="video-info-item">
                    <span class="video-info-label">FPS:</span>
                    <span id="fpsCounter">60</span>
                </div>
                <div class="video-info-item">
                    <span class="video-info-label">劣化度:</span>
                    <span id="degradationLevel">0%</span>
                </div>
                <div class="video-info-item">
                    <span class="video-info-label">音声品質:</span>
                    <span id="audioQuality">清晰</span>
                </div>
                <div class="video-info-item">
                    <span class="video-info-label">状態:</span>
                    <span id="statusText" style="color: #4caf50;">待機中</span>
                </div>
            </div>
        </div>

        <!-- サイドパネル -->
        <div class="side-panel">
            <!-- 通信崩壊シーケンサー -->
            <div class="panel-card calamity-card">
                <div class="card-title">
                    <span class="card-title-icon">📉</span>
                    <span>通信崩壊シーケンサー</span>
                </div>

                <div class="button-group">
                    <button id="startCalamityBtn" class="btn btn-primary">
                        <span>▶️</span>
                        <span>崩壊開始</span>
                    </button>
                    <button id="stopCalamityBtn" class="btn btn-danger" disabled>
                        <span>⏹️</span>
                        <span>緊急停止 (Space)</span>
                    </button>
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>崩壊完了時間</span>
                        <span class="slider-value" id="durationValue">90秒</span>
                    </div>
                    <input id="durationSlider" type="range" min="30" max="180" step="30" value="90">
                </div>

                <div class="slider-group">
                    <div class="slider-label">
                        <span>音声劣化速度</span>
                        <span class="slider-value" id="audioSpeedValue">標準</span>
                    </div>
                    <input id="audioSpeedSlider" type="range" min="1" max="3" step="1" value="1">
                </div>

                <div class="progress-bar">
                    <div id="sequenceProgress" class="progress-fill"></div>
                </div>

                <div class="status-display">
                    <div class="status-item">
                        <span class="status-label">現フェーズ:</span>
                        <span class="status-value" id="currentPhase">
                            <span class="phase-indicator">待機</span>
                        </span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">経過時間:</span>
                        <span class="status-value" id="elapsedTime">0s</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">リップシンクずれ:</span>
                        <span class="status-value" id="lipSyncValue">0ms</span>
                    </div>
                </div>
            </div>

            <!-- 定型チャット文 -->
            <div class="panel-card">
                <div class="card-title">
                    <span class="card-title-icon">💬</span>
                    <span>脱出メッセージ</span>
                </div>

                <div class="button-group">
                    <button id="copyMessageBtn" class="btn btn-secondary">
                        <span>📋</span>
                        <span>コピー（完了後）</span>
                    </button>
                </div>

                <div style="font-size: 12px; color: #666; background: #f5f5f5; padding: 10px; border-radius: 6px; line-height: 1.6;">
                    「すみません、Wi-Fiが限界なので一度ルーター再起動してきます」
                </div>
            </div>

            <!-- プレビューモニタ -->
            <div class="panel-card">
                <div class="card-title">
                    <span class="card-title-icon">👁️</span>
                    <span>相手視点プレビュー</span>
                </div>

                <div class="preview-monitor">
                    <div class="preview-title">相手に見えている画像</div>
                    <canvas id="previewCanvas" class="preview-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 完了モーダル -->
    <div id="completeModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎭</div>
            <div class="modal-title">通信崩壊完了</div>
            <div class="modal-message">
                あなたの電波は限界に達しました。<br>
                相手からの切断促しを待つか、自然に落ちるのを待ってください。
            </div>
            <div class="modal-buttons">
                <button id="modalCloseBtn" class="btn btn-primary">了解</button>
            </div>
        </div>
    </div>

      <script src="js/app.js"></script>
</body>
</html>
