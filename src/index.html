<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 5 - Quantum Dissolve Sequencer</title>
      <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚛️ Quantum Dissolve</h1>
            <p>Phase 5 - 段階的フェードアウトシーケンサー</p>
        </div>

        <div class="video-section">
            <canvas id="canvas"></canvas>
            <div class="progress-indicator">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="stage-label" id="stageLabel">待機中</div>
            <div class="time-display" id="timeDisplay">00:00</div>
            <div class="reconnect-spinner" id="reconnectSpinner"></div>
            <div class="reconnect-text" id="reconnectText">再接続中...</div>
            <div class="bailout-indicator" id="bailoutIndicator">[SPACE] で復帰</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>⏱️ 脱出完了時間を選択</label>
                <div class="slider-wrapper">
                    <input type="range" id="timeSlider" min="180" max="900" value="300" step="30">
                    <div class="time-value" id="timeValue">5分 00秒</div>
                </div>
            </div>

            <div class="control-group">
                <label>⚡ クイックプリセット</label>
                <div class="preset-buttons">
                    <button class="preset-btn" data-time="180">3分<br>（お急ぎ）</button>
                    <button class="preset-btn active" data-time="300">5分<br>（標準）</button>
                    <button class="preset-btn" data-time="600">10分<br>（超自然）</button>
                </div>
            </div>

            <div class="control-group">
                <label>🎬 実行コントロール</label>
                <div class="action-buttons">
                    <button class="btn-start" id="btnStart">シーケンス開始</button>
                    <button class="btn-abort" id="btnAbort" disabled>緊急アボート</button>
                </div>
            </div>

            <div class="status-display">
                <div class="status-line"><span class="status-label">状態:</span> <span id="statusState">準備完了</span></div>
                <div class="status-line"><span class="status-label">フェーズ:</span> <span id="statusPhase">-</span></div>
                <div class="status-line"><span class="status-label">経過時間:</span> <span id="statusElapsed">00:00</span></div>
                <div class="status-line"><span class="status-label">残り時間:</span> <span id="statusRemaining">-</span></div>
                <div class="status-line"><span class="status-label">映像FPS:</span> <span id="statusFps">60</span></div>
                <div class="status-line"><span class="status-label">彩度:</span> <span id="statusSaturation">100%</span></div>
                <div class="status-line"><span class="status-label">音声:</span> <span id="statusAudio">通常</span></div>
            </div>

            <div class="info-box">
                <strong>ℹ️ 使い方:</strong><br>
                1. 脱出完了時間を選択（3分/5分/10分）<br>
                2. 「シーケンス開始」をクリック<br>
                3. 自動的に3段階でフェードアウト<br>
                4. 緊急時は <strong>[SPACE]キー長押し</strong> または <strong>「緊急アボート」</strong> でリセット
            </div>
        </div>
    </div>

      <script src="js/app.js"></script>
</body>
</html>
